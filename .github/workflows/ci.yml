name: Python CI

on:
  push:
    paths:
      - "projects/python-ci-pipeline/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "projects/python-ci-pipeline/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: projects/python-ci-pipeline
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: projects/python-ci-pipeline
        run: pytest

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        working-directory: projects/python-ci-pipeline
        run: |
          docker build -t ghcr.io/jefin3273/devops-engineering-journey/python-ci-demo:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push ghcr.io/jefin3273/devops-engineering-journey/python-ci-demo:${{ github.sha }}
